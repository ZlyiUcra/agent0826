# Сховище векторів для практик курсу. Один сервер на весь репозиторій: модулі
# тримають окремі копії коду й документів, але база в них спільна, а розділені
# набори лежать у ній окремими колекціями (spec-core-e5, spec-full-e5 і так далі
# — ім'я збирається з набору документів і моделі ембедингів).
#
#   docker compose up -d      підняти
#   docker compose ps         подивитися стан
#   docker compose stop       зупинити, не чіпаючи даних
#
# Практика вміє те саме сама, тими самими іменами:
#   python -m practice.challenges.qdrant_store --up
#
# Дані живуть в іменованому томі agent0826-qdrant і переживають зупинку,
# перезапуск і видалення контейнера. Зникають вони лише разом із самим томом,
# тобто за явною командою docker volume rm agent0826-qdrant. `docker compose
# down` том НЕ видаляє; видаляє його тільки `docker compose down -v`, і саме
# тому цієї команди немає в переліку вище.
name: agent0826

services:
  qdrant:
    image: qdrant/qdrant
    container_name: agent0826-qdrant
    ports:
      - "6333:6333"   # HTTP API і дашборд на /dashboard
      - "6334:6334"   # gRPC, практика ним не користується
    volumes:
      - qdrant-storage:/qdrant/storage

volumes:
  qdrant-storage:
    # Ім'я тому задане явно, щоб воно збігалося з тим, яким сервер уже піднято
    # руками: інакше compose створив би власний том agent0826_qdrant-storage,
    # і залиті фрагменти виглядали б зниклими.
    name: agent0826-qdrant
